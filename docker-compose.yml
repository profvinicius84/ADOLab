services:
  db:
    image: postgres:16-alpine
    container_name: adolab-db
    environment:
      POSTGRES_DB: alunosdb
      POSTGRES_USER: adolab
      POSTGRES_PASSWORD: adolab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adolab -d alunosdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
